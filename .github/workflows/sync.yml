name: Synchro Apple Music → Spotify

on:
  schedule:
    - cron: "*/10 * * * *" # toutes les 10 minutes (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Déclencher la synchro
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # Seul le code HTTP est affiché : les logs sont publics si le dépôt l'est.
        # Le détail de chaque synchro est visible dans le tableau de bord.
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$SITE_URL/api/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90)
          echo "HTTP $code"
          test "$code" = "200"
